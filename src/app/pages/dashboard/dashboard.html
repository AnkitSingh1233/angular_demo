<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card shadow border-0 profile-card">
    <div class="card-body p-4 text-center">

      <div class="avatar mx-auto mb-3">{{ initials() }}</div>

      <h4 class="mb-1">{{ auth.user()?.name }}</h4>
      <p class="text-muted mb-4">{{ auth.user()?.email }}</p>

      <ul class="list-group list-group-flush text-start mb-4">
        <li class="list-group-item d-flex justify-content-between">
          <span class="text-muted"><i class="bi bi-person me-2"></i>User ID</span>
          <span class="fw-semibold">{{ auth.user()?.id }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span class="text-muted"><i class="bi bi-person-badge me-2"></i>Name</span>
          <span class="fw-semibold">{{ auth.user()?.name }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span class="text-muted"><i class="bi bi-envelope me-2"></i>Email</span>
          <span class="fw-semibold">{{ auth.user()?.email }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span class="text-muted"><i class="bi bi-shield-check me-2"></i>Status</span>
          <span class="badge bg-success-subtle text-success">Active</span>
        </li>
      </ul>

      <button type="button" class="btn btn-danger w-100" (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
      </button>

    </div>
  </div>
</div>
